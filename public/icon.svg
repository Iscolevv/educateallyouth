<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Added white background and proper padding for app icon -->
  <rect width="512" height="512" fill="white"/>
  
  <!-- EducateAll logo centered with padding -->
  <g transform="translate(96, 180)">
    <!-- EducateAll text in blue -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="600" fill="#0284C7" letter-spacing="-1">EducateAll</text>
    
    <!-- YOUTH ORGANIZATION text in gray -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#7C7C7C" letter-spacing="1">YOUTH ORGANIZATION</text>
    
    <!-- Yellow/Gold underline -->
    <line x1="0" y1="100" x2="320" y2="100" stroke="#FFA500" stroke-width="3"/>
    
    <!-- Decorative dots -->
    <circle cx="-10" cy="85" r="3" fill="#0284C7"/>
    <circle cx="-10" cy="115" r="3" fill="#FFA500"/>
  </g>
</svg>
